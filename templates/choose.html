<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매장 선택</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 700px">
    <a href="{{ url_for('index') }}">검색 화면으로</a>
    <h1 class="h3 mt-4">찾으시는 매장이 여기인가요?</h1>
    <p>상호와 주소를 확인한 뒤 지점을 선택해 주세요.</p>
    <form action="{{ url_for('search') }}" method="get" class="d-flex gap-2 mb-4">
      <input type="hidden" name="choose" value="1">
      <input class="form-control" name="q" aria-label="매장명 또는 동네" value="{{ query }}" maxlength="200" required>
      <button class="btn btn-outline-primary text-nowrap">다시 검색</button>
    </form>
    {% if error %}<p role="alert" class="alert alert-warning">{{ error }}</p>{% endif %}
    {% for c in candidates %}
      <form class="card p-3 mb-2" action="{{ url_for('select_place') }}" method="post">
        <input type="hidden" name="q" value="{{ query }}">
        <input type="hidden" name="kakao_id" value="{{ c.id }}">
        <h2 class="h5">{{ c.name }}</h2>
        <p>{{ c.address }}</p>
        <div><button class="btn btn-primary">이 매장 선택</button>
          <a class="ms-2" href="https://place.map.kakao.com/{{ c.id }}" target="_blank" rel="noopener">카카오맵에서 보기</a></div>
      </form>
    {% else %}
      {% if not error %}<p>매장을 찾지 못했습니다. 브랜드와 동네 또는 도로명을 함께 입력해 보세요.</p>{% endif %}
    {% endfor %}
  </main>
</body>
</html>
