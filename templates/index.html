<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 760px;">
    <h2 class="mb-2">RE</h2>
    <p class="text-muted mb-4">DB에 저장된 리뷰를 우선 조회하고, 없으면 네이버·카카오맵 리뷰를 수집해 분석합니다.</p>

    <form action="/search" method="get" class="input-group input-group-lg mb-5">
      <input type="text" name="q" class="form-control" placeholder="예: 오쭈꾸미 홍대본점" required>
      <button type="submit" class="btn btn-primary">검색</button>
    </form>

    <h5 class="mb-3">DB 저장 매장 (클릭 시 즉시 조회)</h5>
    <div class="list-group">
      {% for p in recent_places %}
        <a href="/search?q={{ p['store_name'] }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ p['store_name'] }}</strong>
            <small class="text-muted ms-2">리뷰 {{ p['review_count'] }}개 · 평균 {{ p['avg_rating'] }}</small>
          </div>
          <span class="badge text-bg-secondary">{{ p['updated_at'] }}</span>
        </a>
      {% else %}
        <div class="list-group-item text-muted">아직 저장된 매장이 없습니다.</div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
